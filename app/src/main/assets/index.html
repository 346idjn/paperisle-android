<script>
const ICON={home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21zM4 5.5v13A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10h7"/></svg>',stats:'<svg viewBox="0 0 24 24"><path d="M4 20V11h4v9M10 20V5h4v15M16 20v-8h4v8M3 20h18"/></svg>',note:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>',settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1 1.9-1.6 2.8-2.1-.2a7.8 7.8 0 0 1-1.5.9l-.9 1.5h-3.2l-.9-1.5a7.8 7.8 0 0 1-1.5-.9l-2.1.2-1.6-2.8 1.1-1.9a7.4 7.4 0 0 1 0-1.8l-1.1-1.9 1.6-2.8 2.1.2a7.8 7.8 0 0 1 1.5-.9l.9-1.5h3.2l.9 1.5a7.8 7.8 0 0 1 1.5.9l2.1-.2 1.6 2.8-1.1 1.9a7.4 7.4 0 0 1 0 1.7z"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM15 5h3v14h-3z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 13v7h14v-7"/></svg>',grid:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',spark:'<svg viewBox="0 0 24 24"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>'};
for(const k in ICON)ICON[k]=ICON[k].replace('<svg ','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ');
const seedBooks=[
{id:'b1',title:'云上灯塔',author:'周以宁',genre:'小说',tags:['慢读','小说'],color:'sage',status:'在读',progress:28,content:'海边的雾总在天亮前抵达。它先漫过石阶，再轻轻盖住小镇屋顶，最后把灯塔也收进去，只留下那一点暖黄色的光。\n\n林遥每天清晨都来擦拭灯室的玻璃。她做这件事已经七年，熟悉每一颗螺丝的松紧，也记得每一次风暴来临前，海面会先变成怎样的颜色。\n\n父亲离开以后，镇上的人劝她把灯塔交给管理处。可她总觉得，灯不是为了照亮已经看见的路，而是为了告诉还在海上的人：岸一直都在。\n\n这天早晨，雾比往常更浓。林遥刚放下擦布，就听见楼梯下传来一声轻轻的敲门。门外站着一个浑身湿透的男孩，怀里抱着一只没有指针的旧钟。\n\n“请问，”男孩抬起头，“这里能不能把时间调慢一点？”'},
{id:'b2',title:'雨停以后',author:'林间来信',genre:'随笔',tags:['随笔','日常'],color:'clay',status:'在读',progress:12,content:'雨停的时候，街道并没有立刻变亮。云还在屋檐上停留，窗台的水珠沿着边缘慢慢聚拢，最后落在一盆薄荷旁边。\n\n我喜欢这样的间隙。不是下雨，也还没有放晴，像一句话说完之后留下的呼吸。人们撑着伞走远，路口的面包店把第一炉面包放进橱窗，热气让玻璃起了一层薄薄的雾。\n\n今天没有什么特别的事。只是把一封拖了很久的信寄出去，顺路买了两枝白色的小花，然后决定回家时不看手机。\n\n生活偶尔会把答案藏在很小的地方：一块被雨洗干净的石头，一杯刚好温热的茶，或者有人记得你喜欢窗边的位置。'},
{id:'b3',title:'植物的慢时间',author:'许青禾',genre:'自然',tags:['自然','科普'],color:'blue',status:'待读',progress:0,content:'种子并不知道春天的日期。它只感受到土壤的湿度、空气的温度，以及光线在一天之中缓慢改变的方向。于是它开始松开外壳，把细小的根伸向更深处。\n\n我们常常把生长想象成向上的力量，但最初的生长往往发生在看不见的地方。根须在黑暗里辨认水分，叶芽在泥土下等待恰好的时刻。\n\n一棵树的年轮不是简单的刻度，而是它和天气、土地、邻近的植物共同写下的记录。干旱留下窄窄的一圈，丰沛的夏季则让木质部舒展得更开。'},
{id:'b4',title:'旧城散步地图',author:'顾行舟',genre:'随笔',tags:['城市','随笔'],color:'cream',status:'已读',progress:100,content:'如果把城市地图折起来，所有没有标注的地方就会相遇。巷口那家旧书店，桥边总在午后出现的白猫，还有南街尽头会唱歌的修鞋匠——它们都不在导航上，却构成了回家的方向。\n\n我开始散步，是因为有一天错过了末班车。那晚我沿着河走了很久，直到街灯一盏盏亮起，才发现熟悉的城市也可以有另一种速度。'},
{id:'b5',title:'给未来的信',author:'沈一禾',genre:'书信',tags:['成长','书信'],color:'plum',status:'待读',progress:0,content:'亲爱的你：\n\n写这封信的时候，我坐在一间安静的咖啡馆里。窗外有一棵刚刚抽芽的树，枝条伸向灰蓝色的天空，像许多尚未说出口的句子。\n\n我想告诉你，不必急着成为一个答案。那些暂时没有名字的日子，也在悄悄把你带到更宽阔的地方。请继续好奇，继续散步，也继续相信小小的善意。\n\n等你读到这里，希望你已经学会对自己温柔一点。'}
];
function load(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
const state={screen:'home',books:load('pi_books',seedBooks),notes:load('pi_notes',[]),goal:load('pi_goal',{minutes:30,year:24}),theme:load('pi_theme','light'),query:'',filter:'全部',bookId:null,tts:false,font:18,speed:1,layout:load('pi_layout','grid'),readerMode:load('pi_reader_mode','paper')};
if(!Array.isArray(state.books)||!state.books.length)state.books=seedBooks;if(!Array.isArray(state.notes))state.notes=[];
const app=document.getElementById('app');let toastTimer,readSeconds=0,lastTick=Date.now(),readerActive=false,saveScrollTimer,readerPageIndex=0,readerPageCount=1,readerPageOffsets=[],readerPageBookId=null,screenHistory=[],controlsTimer=null,swipeHandledAt=0;
function save(){localStorage.setItem('pi_books',JSON.stringify(state.books));localStorage.setItem('pi_notes',JSON.stringify(state.notes));localStorage.setItem('pi_goal',JSON.stringify(state.goal));localStorage.setItem('pi_theme',JSON.stringify(state.theme));localStorage.setItem('pi_layout',JSON.stringify(state.layout));localStorage.setItem('pi_reader_mode',JSON.stringify(state.readerMode))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ico(n){return ICON[n]||''}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function readToday(){return load('pi_minutes_'+localDate(),0)}
function recordMinute(){const key='pi_minutes_'+localDate();localStorage.setItem(key,JSON.stringify(readToday()+1));const b=getBook();if(b){const today=localDate();if(b.todayMinutesDate!==today){b.todayMinutesDate=today;b.todayMinutes=0}b.todayMinutes=(b.todayMinutes||0)+1;b.minutes=(b.minutes||0)+1;b.lastReadAt=Date.now();save()}}
function setReaderActive(){readerActive=state.screen==='reader'&&!document.hidden;lastTick=Date.now()}
function tickReading(){const now=Date.now(),delta=Math.min(12,Math.max(0,(now-lastTick)/1000));lastTick=now;if(!readerActive||state.screen!=='reader'||document.hidden)return;readSeconds+=delta;while(readSeconds>=60){readSeconds-=60;recordMinute()}}
function bookCover(b,extra=''){const coverData=typeof b.coverData==='string'&&b.coverData.length<=524288&&/^[A-Za-z0-9+/]+={0,2}$/.test(b.coverData)?b.coverData:'';const cover=coverData?`<img class="cover-art" src="data:image/jpeg;base64,${coverData}" alt="" loading="lazy">`:'';return `<div class="book-cover tone-${esc(b.color||'sage')} ${coverData?'cover-from-file':''} ${extra}">${cover}<span class="cover-kicker">纸屿 · ${esc(b.genre||'阅读')}</span><span class="cover-title">${esc(b.title)}</span><span class="cover-author">${esc(b.author||'')}</span></div>`}
function getBook(id=state.bookId){return state.books.find(b=>b.id===id)}
function currentDateLabel(){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function greeting(){const h=new Date().getHours();return h<6?'夜深了，读一点喜欢的':h<11?'早上好，今天读一点':h<18?'午后留一点给阅读':'晚上好，慢慢读一会'}
function topbar(){return `<header class="topbar"><div class="brand"><div class="brand-mark">${ico('book')}</div><div><div class="brand-name">纸屿</div><div class="brand-tag">给阅读留一点空白</div></div></div><div class="top-actions"><button class="icon-button" data-go="settings" aria-label="设置">${ico('settings')}</button></div></header>`}
function nav(){if(state.screen==='reader'||state.screen==='book-detail')return '';const items=[['home','home','首页'],['library','book','书架'],['notes','note','摘录'],['stats','stats','统计']];return `<nav class="bottom-nav">${items.map(([id,ic,label])=>`<button class="nav-item ${state.screen===id?'active':''}" data-go="${id}"><span class="nav-icon">${ico(ic)}</span><span>${label}</span></button>`).join('')}</nav>`}
function homeScreen(){const today=readToday(),goal=state.goal.minutes,percent=Math.min(100,Math.round(today/Math.max(goal,1)*100)),continueBook=state.books.find(b=>b.status==='在读')||state.books.find(b=>b.status!=='已读')||state.books[0],reading=state.books.filter(b=>b.status==='在读').length,finished=state.books.filter(b=>b.status==='已读').length;const excerpt=continueBook?(continueBook.content||'').split(/\n+/).filter(Boolean)[0]:'';return `${topbar()}<main class="screen-in"><div class="home-intro"><div class="date-stamp">${currentDateLabel()}</div><h1>${greeting()}</h1><p>每一页，都是给自己的小小礼物。</p></div>${continueBook?`<section class="hero-card"><div class="hero-copy"><span class="hero-eyebrow">接着上次的那一页</span><h2 class="hero-title">${esc(continueBook.title)}</h2><div class="hero-author">${esc(continueBook.author)} · ${continueBook.progress||0}%</div><p class="hero-description">${esc(excerpt)}</p><button class="hero-cta" data-open="${continueBook.id}">继续阅读 ${ico('play')}</button></div><div class="hero-cover-wrap">${bookCover(continueBook)}</div></section>`:`<section class="hero-card"><div class="hero-copy"><span class="hero-eyebrow">从一页开始</span><h2 class="hero-title">把喜欢的书<br>放进书架</h2><div class="hero-author">今天也可以开始一段新旅程</div><button class="hero-cta" data-action="import">添加一本书 ${ico('plus')}</button></div></section>`}<section class="daily-card"><div class="goal-ring" style="--goal-angle:${percent*3.6}deg"><span>${percent}%</span></div><div class="goal-copy"><div class="goal-copy-label">今日阅读目标</div><strong>${today}<small> / ${goal} 分钟</small></strong></div><div class="goal-side">${percent>=100?'今日达成':'再读 '+Math.max(0,goal-today)+' 分钟'}</div></section><div class="section-title-row"><h2 class="section-title">正在读 <span class="section-meta">${reading} 本</span></h2><button class="small-cta" data-go="library">全部书架 ${ico('back')}</button></div><div class="shelf-row">${state.books.filter(b=>b.status==='在读').slice(0,8).map(b=>`<article class="shelf-book" data-open="${b.id}">${bookCover(b)}<div class="shelf-book-name">${esc(b.title)}</div><div class="shelf-book-meta">读到 ${b.progress||0}%</div></article>`).join('')||`<div class="empty-state" style="min-width:100%">书架还空着，导入 TXT 或 EPUB，开始你的第一本。</div>`}</div><div class="section-title-row"><h2 class="section-title">今日片刻</h2><button class="small-cta" data-go="stats">阅读记录 ${ico('back')}</button></div><section class="quote-strip"><span class="quote-mark">“</span><p class="quote-text">${esc(excerpt||'为今天留一页安静，也为明天留一点期待。')}</p><div class="quote-source">${continueBook?'《'+esc(continueBook.title)+'》':'纸屿 · 阅读日常'}</div></section><div class="quick-stats"><div class="quick-stat"><strong>${state.books.length}</strong><span>书架藏书</span></div><div class="quick-stat"><strong>${reading}</strong><span>正在读</span></div><div class="quick-stat"><strong>${finished}</strong><span>读完的书</span></div></div></main>`}

function turnReaderPage(direction){const screen=document.querySelector('.reader-screen');if(!screen)return;const next=Math.max(0,Math.min(readerPageCount-1,readerPageIndex+direction));if(next===readerPageIndex){toast(direction>0?'已经是最后一页':'已经是第一页');return}const prefs=state.readerPrefs||{},requested=Number(prefs.turnDuration),duration=requested===0?0:Math.max(.22,Math.min(.72,(Number.isFinite(requested)?requested:.3)*1.6)),body=document.getElementById('readerBody'),scroller=document.getElementById('readerScroller');let flip=null;if(prefs.turnEffect!=='slide'&&duration>0&&body&&scroller&&body.children[readerPageIndex]){flip=body.children[readerPageIndex].cloneNode(true);flip.className='reader-page page-turn-overlay '+(direction>0?'page-turn-forward':'page-turn-backward');flip.setAttribute('aria-hidden','true');Object.assign(flip.style,{position:'absolute',left:'0',top:'0',width:scroller.clientWidth+'px',height:scroller.clientHeight+'px',flex:'none',zIndex:'20',pointerEvents:'none',transformOrigin:direction>0?'left center':'right center',backfaceVisibility:'hidden',transformStyle:'preserve-3d'});scroller.style.perspective='1200px';scroller.appendChild(flip);setReaderPage(next);if(typeof flip.animate==='function'){const frames=direction>0?[{transform:'rotateY(0deg)',filter:'brightness(1)',boxShadow:'0 0 0 rgba(0,0,0,0)'},{offset:.52,transform:'rotateY(-62deg)',filter:'brightness(.88)',boxShadow:'-10px 0 20px rgba(48,38,22,.20)'},{transform:'rotateY(-154deg)',filter:'brightness(.72)',boxShadow:'-26px 0 34px rgba(48,38,22,.28)',opacity:.02}]:[{transform:'rotateY(0deg)',filter:'brightness(1)',boxShadow:'0 0 0 rgba(0,0,0,0)'},{offset:.48,transform:'rotateY(58deg)',filter:'brightness(.9)',boxShadow:'10px 0 18px rgba(48,38,22,.18)'},{transform:'rotateY(150deg)',filter:'brightness(.74)',boxShadow:'26px 0 32px rgba(48,38,22,.25)',opacity:.02}];const anim=flip.animate(frames,{duration:duration*1000,easing:'cubic-bezier(.22,.72,.2,1)',fill:'forwards'});anim.onfinish=()=>{if(flip&&flip.parentNode)flip.remove()};anim.oncancel=()=>{if(flip&&flip.parentNode)flip.remove()}}else setTimeout(()=>{if(flip&&flip.parentNode)flip.remove()},duration*1000+50)}else setReaderPage(next);if(!screen.classList.contains('controls-faded'))scheduleReaderControls()}
function scheduleReaderControls(){const screen=document.querySelector('.reader-screen');if(!screen)return;screen.classList.remove('controls-hidden');if(controlsTimer)clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{const current=document.querySelector('.reader-screen');if(current&&state.screen==='reader')current.classList.add('controls-hidden')},3200)}

function attachReaderGestures(){const scroller=document.getElementById('readerScroller');if(!scroller)return;let start=null;scroller.addEventListener('touchstart',e=>{if(e.touches.length===1)start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});scroller.addEventListener('touchend',e=>{if(!start||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.15){swipeHandledAt=Date.now();turnReaderPage(dx<0?1:-1);e.preventDefault()}},{passive:false});scroller.addEventListener('click',e=>{if(Date.now()-swipeHandledAt<450||window.getSelection?.().toString())return;const rect=scroller.getBoundingClientRect(),x=e.clientX-rect.left;if(x<rect.width*.28)turnReaderPage(-1);else if(x>rect.width*.72)turnReaderPage(1);else toggleReaderControls()})}
function openBook(id){if(state.screen!=='reader')state.readerReturnScreen=state.screen;state.bookId=id;state.screen='reader';state.tts=false;const b=getBook(id);if(b){if(b.status==='待读')b.status='在读';b.lastReadAt=Date.now()}save();render();window.scrollTo(0,0)}

function importFile(){if(window.Android&&Android.chooseTextFile)Android.chooseTextFile();else document.getElementById('fileFallback').click()}
window.receiveImportedFile=(name,content,author,format,coverData='',metadata={},silent=false)=>{if(!content||!content.trim()){if(!silent)toast('这个文件没有可读取的正文');return}const clean=(name||'导入的书').replace(/^.*[\\/]/,'').replace(/\.(txt|text|epub)$/i,'')||'导入的书',fmt=(format||(/\.epub$/i.test(name)?'EPUB':'TXT')).toUpperCase(),meta=metadata&&typeof metadata==='object'&&!Array.isArray(metadata)?metadata:{},b={id:'u'+Date.now()+Math.random().toString(36).slice(2,6),title:clean,author:author||'本地导入',genre:fmt,tags:['导入',fmt],color:['sage','clay','blue','cream','plum'][state.books.length%5],status:'待读',progress:0,content,format:fmt,coverData:typeof coverData==='string'&&coverData.length<=524288&&/^[A-Za-z0-9+/]+={0,2}$/.test(coverData)?coverData:'',description:String(meta.description||''),publisher:String(meta.publisher||''),publishedAt:String(meta.publishedAt||''),language:String(meta.language||''),subject:String(meta.subject||''),chapterCount:Number(meta.chapterCount)||0,toc:Array.isArray(meta.toc)?meta.toc.slice(0,500):[],addedAt:Date.now(),lastReadAt:0,pageIndex:0,pageCount:0,minutes:0,todayMinutes:0,todayMinutesDate:localDate(),scrollTop:0};state.books.unshift(b);save();state.screen='library';state.query='';state.filter='全部';render();if(!silent)toast('已加入书架：'+clean)};
document.getElementById('fileFallback').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;let imported=0;const failed=[];for(const f of files){if(/\.epub$/i.test(f.name)){failed.push(f.name+'（请在安卓应用中导入 EPUB）');continue}try{const text=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('读取失败'));reader.readAsText(f,'UTF-8')});window.receiveImportedFile(f.name,text,'本地导入','TXT','',{},files.length>1);imported++}catch(error){failed.push(f.name+'（读取失败）')}}if(files.length===1&&failed.length)toast(failed[0]);else if(files.length>1)toast(`批量导入完成：成功 ${imported} 份，失败 ${failed.length} 份${failed.length?'；'+failed.slice(0,2).join('；'):''}`);e.target.value=''})
function openNote(){const selected=(window.getSelection?window.getSelection().toString():'').trim(),b=getBook();if(!b)return;const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.innerHTML=`<section class="modal"><h3>收下一段灵感</h3><div class="page-subtitle">《${esc(b.title)}》· 可以先选中文字</div><label>摘录</label><textarea id="noteQuote" placeholder="粘贴或输入想留下的句子">${esc(selected)}</textarea><label>我的想法（可选）</label><textarea id="noteMemo" placeholder="写下读到这里时的想法…"></textarea><div class="modal-buttons"><button data-modal-cancel>取消</button><button class="primary" data-modal-save>保存摘录</button></div></section>`;document.body.appendChild(backdrop);backdrop.addEventListener('click',e=>{if(e.target===backdrop||e.target.closest('[data-modal-cancel]'))backdrop.remove();if(e.target.closest('[data-modal-save]')){const quote=backdrop.querySelector('#noteQuote').value.trim(),memo=backdrop.querySelector('#noteMemo').value.trim();if(!quote){toast('先写下一段摘录');return}state.notes.push({quote,memo,bookTitle:b.title,bookId:b.id,date:new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric'}).format(new Date()),color:'#d6a76c'});save();backdrop.remove();toast('摘录已保存');if(state.screen==='notes')render()}})}

function changeReaderMode(){state.readerMode=state.readerMode==='paper'?'sepia':state.readerMode==='sepia'?'night':'paper';save();render()}
function handleAction(action,el){const b=getBook();switch(action){case'book-details':{const book=state.books.find(x=>x.id===(el&&el.dataset.bookId));if(book){state.bookId=book.id;state.detailReturnScreen=state.screen;state.screen='book-detail';render()}break}case'detail-back':navigateBack();break;case'book-detail-read':if(b)openBook(b.id);break;case'save-book-details':{if(!b)break;const title=document.getElementById('bookDetailTitle').value.trim(),author=document.getElementById('bookDetailAuthor').value.trim(),genre=document.getElementById('bookDetailGenre').value.trim(),tagText=document.getElementById('bookDetailTags').value,status=document.getElementById('bookDetailStatus').value;if(!title){toast('书名不能为空');break}b.title=title;b.author=author||'作者未录';b.genre=genre||b.format||'本地书籍';b.tags=tagText.split(/[，,、;；]/).map(x=>x.trim()).filter(Boolean).slice(0,12);b.status=['待读','在读','已读'].includes(status)?status:'待读';b.updatedAt=Date.now();state.notes.forEach(n=>{if(n.bookId===b.id)n.bookTitle=b.title});save();render();toast('书籍资料已保存');break}case'import':importFile();break;case'back':navigateBack();break;case'theme':state.theme=state.theme==='night'?'light':'night';save();render();break;case'reader-mode':changeReaderMode();break;case'prev-page':turnReaderPage(-1);break;case'next-page':turnReaderPage(1);break;case'toggle-controls':toggleReaderControls();break;case'layout':state.layout=state.layout==='grid'?'list':'grid';save();render();break;case'daily-goal':{const n=prompt('每天希望阅读多少分钟？',state.goal.minutes);if(n!==null&&Number(n)>0){state.goal.minutes=Math.min(600,Math.floor(Number(n)));save();render()}}break;case'year-goal':{const n=prompt('今年希望读完多少本？',state.goal.year);if(n!==null&&Number(n)>0){state.goal.year=Math.min(999,Math.floor(Number(n)));save();render()}}break;case'font-up':state.font=Math.min(27,state.font+1);render();break;case'font-down':state.font=Math.max(14,state.font-1);render();break;case'tts':if(!b)return;if(state.tts){window.Android&&Android.stopSpeech( app.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){setScreen(go.dataset.go);return}const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}const open=e.target.closest('[data-open]');if(open){openBook(open.dataset.open);return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return}const share=e.target.closest('[data-share-note]');if(share){const n=state.notes[Number(share.dataset.shareNote)],text=`“${n.quote}”\n——《${n.bookTitle}》${n.memo?'\n\n'+n.memo:''}`;if(window.Android&&Android.shareText)Android.shareText('阅读摘录',text);else navigator.clipboard?.writeText(text).then(()=>toast('已复制摘录'));return}const del=e.target.closest('[data-delete-note]');if(del){showConfirm('删除这条摘录？','删除后无法恢复。',()=>{state.notes.splice(Number(del.dataset.deleteNote),1);save();render()});return}});
